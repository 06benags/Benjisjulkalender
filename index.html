<!doctype html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benjis julkalender</title>
  <link rel="stylesheet" href="style.css?v=11">
  <script src="script.js?v=2" defer></script>
</head>
<body>
  <h1 class="page-title">Benjis julkalender</h1>
  <main class="calendar" aria-label="Julkalender med 24 luckor">
    <button class="door" type="button" aria-label="Öppna lucka 1" data-door="1">1</button>
    <button class="door" type="button" aria-label="Lucka 2">2</button>
    <button class="door" type="button" aria-label="Lucka 3">3</button>
    <button class="door" type="button" aria-label="Lucka 4">4</button>
    <button class="door" type="button" aria-label="Lucka 5">5</button>
    <button class="door" type="button" aria-label="Lucka 6">6</button>
    <button class="door" type="button" aria-label="Lucka 7">7</button>
    <button class="door" type="button" aria-label="Lucka 8">8</button>
    <button class="door" type="button" aria-label="Lucka 9">9</button>
    <button class="door" type="button" aria-label="Lucka 10">10</button>
    <button class="door" type="button" aria-label="Lucka 11">11</button>
    <button class="door" type="button" aria-label="Lucka 12">12</button>
    <button class="door" type="button" aria-label="Lucka 13">13</button>
    <button class="door" type="button" aria-label="Lucka 14">14</button>
    <button class="door" type="button" aria-label="Lucka 15">15</button>
    <button class="door" type="button" aria-label="Lucka 16">16</button>
    <button class="door" type="button" aria-label="Lucka 17">17</button>
    <button class="door" type="button" aria-label="Lucka 18">18</button>
    <button class="door" type="button" aria-label="Lucka 19">19</button>
    <button class="door" type="button" aria-label="Lucka 20">20</button>
    <button class="door" type="button" aria-label="Lucka 21">21</button>
    <button class="door" type="button" aria-label="Lucka 22">22</button>
    <button class="door" type="button" aria-label="Lucka 23">23</button>
    <button class="door" type="button" aria-label="Lucka 24">24</button>
  </main>

  <div class="letter-overlay" id="letter-overlay" hidden>
    <button class="envelope" id="envelope" type="button" aria-label="Öppna brevet">
      <span class="envelope-flap"></span>
      <span class="envelope-seal">✦</span>
      <span class="envelope-label">Till er</span>
      <span class="envelope-hint">Tryck för att öppna</span>
    </button>

    <section class="letter" id="letter" role="dialog" aria-modal="true" aria-labelledby="letter-title" hidden>
      <button class="letter-close" type="button" aria-label="Stäng brevet">×</button>
      <div class="letter-holly" aria-hidden="true">✦ ❄ ✦</div>
      <h2 id="letter-title">Välkommen</h2>

    </section>
  </div>
</body>
</html>
